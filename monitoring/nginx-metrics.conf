# Keep this bounded map aligned with backend route registration.
map $uri $monitor_route {
    default unmatched;
    /auth/admin/invitations /auth/admin/invitations;
    /auth/admin/roles /auth/admin/roles;
    /auth/admin/signing-keys/rotate /auth/admin/signing-keys/rotate;
    /auth/admin/users /auth/admin/users;
    /auth/confirm-login-mail /auth/confirm-login-mail;
    /auth/login /auth/login;
    /auth/login-mail /auth/login-mail;
    /auth/login-verify-otp /auth/login-verify-otp;
    /auth/logout /auth/logout;
    /auth/me /auth/me;
    /auth/password /auth/password;
    /auth/password-reset/complete /auth/password-reset/complete;
    /auth/password-reset/start /auth/password-reset/start;
    /auth/password/2fa /auth/password/2fa;
    /auth/refresh /auth/refresh;
    /auth/register /auth/register;
    /auth/registration-invite /auth/registration-invite;
    /auth/sessions /auth/sessions;
    /auth/sessions/revoke-otp /auth/sessions/revoke-otp;
    /bibtex /bibtex;
    /create-table /create-table;
    /get-tables-list /get-tables-list;
    /metadata /metadata;
    /ping /ping;
    /search /search;
    /tables /tables;
    "~^/article/[^/]+$" "/article/:id";
    "~^/auth/admin/roles/[^/]+/members$" "/auth/admin/roles/:roleID/members";
    "~^/auth/admin/roles/[^/]+/members/[^/]+$" "/auth/admin/roles/:roleID/members/:userID";
    "~^/auth/admin/users/[^/]+/ban$" "/auth/admin/users/:userID/ban";
    "~^/auth/sessions/[^/]+$" "/auth/sessions/:sessionID";
    "~^/auth/sessions/[^/]+/revoke$" "/auth/sessions/:sessionID/revoke";
    "~^/autocomplete/[^/]+$" "/autocomplete/:column";
    "~^/make-table-active/[^/]+$" "/make-table-active/:timestamp";
    "~^/pages/[^/]+$" "/pages/:name";
    "~^/table-imports/[^/]+$" "/table-imports/:importID";
    "~^/table/[^/]+$" "/table/:timestamp";
    ~^/docs(?:/|$) /docs/*;
    /nginx-health /nginx-health;
    /stub_status /stub_status;
}
map $request_method $monitor_method {
    default OTHER;
    GET GET;
    POST POST;
    PUT PUT;
    PATCH PATCH;
    DELETE DELETE;
    HEAD HEAD;
    OPTIONS OPTIONS;
}
map $upstream_response_time $monitor_upstream_time {
    default $upstream_response_time;
    "-" 0;
    "" 0;
}
map $server_name $monitor_service {
    default other;
    176.108.251.108.nip.io go-auth;
    176.108.251.108.sslip.io grafana;
}
map $upstream_addr $monitor_proxied {
    default true;
    "" false;
    "-" false;
}
log_format monitoring '"$monitor_method $monitor_route HTTP/1.1" $status $request_time "$monitor_upstream_time" $monitor_route $monitor_service $monitor_proxied';
