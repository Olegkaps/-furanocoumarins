  - series: probe_success{job="tcp-probe",instance="cassandra:9042"}
    values: '0x10'
  alert_rule_test:
  - eval_time: 5m
    alertname: CassandraTCPProbeFailed
    exp_alerts:
    - exp_labels:
        job: tcp-probe
        instance: cassandra:9042
        severity: critical
      exp_annotations:
        summary: Cassandra CQL TCP port is unreachable
        description: Check Cassandra service and networking. A successful TCP probe
          does not authenticate or execute a CQL query.
- interval: 1m
  input_series:
