- interval: 1m
  input_series:
  - series: nginx_parse_errors_total{job="nginxlog",instance="exporter"}
    values: '0x30'
  alert_rule_test:
  - eval_time: 20m
    alertname: NginxLogParseErrors
    exp_alerts: []
- interval: 1m
  input_series:
  - series: http_requests_total{job="go-auth",instance="test",method="GET",route="/v1/me",status="500"}
    values: 0+10x30
  alert_rule_test:
  - eval_time: 0m
    alertname: FuranoBackend5xx
    exp_alerts: []
  - eval_time: 20m
    alertname: FuranoBackend5xx
    exp_alerts:
    - exp_labels:
        job: go-auth
        instance: test
        method: GET
        route: /v1/me
        severity: warning
      exp_annotations:
        summary: HTTP 5xx responses detected
        description: Inspect failing endpoint logs and dependencies; even low-volume
          sustained failures alert.
- interval: 1m
  input_series:
  - series: http_request_duration_seconds_bucket{job="go-auth",instance="test",method="GET",route="/v1/me",le="1"}
    values: '0x30'
  - series: http_request_duration_seconds_bucket{job="go-auth",instance="test",method="GET",route="/v1/me",le="5"}
    values: 0+10x30
  - series: http_request_duration_seconds_bucket{job="go-auth",instance="test",method="GET",route="/v1/me",le="+Inf"}
    values: 0+10x30
  alert_rule_test:
  - eval_time: 0m
    alertname: FuranoBackendHighLatency
    exp_alerts: []
  - eval_time: 20m
    alertname: FuranoBackendHighLatency
    exp_alerts:
    - exp_labels:
        job: go-auth
        instance: test
        method: GET
        route: /v1/me
        severity: warning
      exp_annotations:
        summary: Endpoint p95 latency exceeds one second
        description: Inspect endpoint latency, load and dependency timings; tune this
          starter threshold to your SLO.
- interval: 1m
  input_series:
  - series: process_start_time_seconds{job="go-auth",instance="authd:8080"}
    values: 100x15 200x15
  alert_rule_test:
  - eval_time: 0m
    alertname: FuranoBackendRestarted
    exp_alerts: []
  - eval_time: 20m
    alertname: FuranoBackendRestarted
    exp_alerts:
    - exp_labels:
        job: go-auth
        instance: authd:8080
        severity: warning
      exp_annotations:
