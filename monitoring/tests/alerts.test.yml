          also trigger this alert.
- interval: 1m
  input_series:
  - series: http_requests_total{job="go-auth",instance="test",method="GET",route="/v1/me",status="200"}
    values: 0+10x30
  alert_rule_test:
  - eval_time: 20m
    alertname: FuranoBackend5xx
    exp_alerts: []
- interval: 1m
  input_series:
  - series: http_request_duration_seconds_bucket{job="go-auth",instance="test",method="GET",route="/v1/me",le="1"}
    values: 0+10x30
  - series: http_request_duration_seconds_bucket{job="go-auth",instance="test",method="GET",route="/v1/me",le="5"}
    values: 0+10x30
  - series: http_request_duration_seconds_bucket{job="go-auth",instance="test",method="GET",route="/v1/me",le="+Inf"}
    values: 0+10x30
  alert_rule_test:
  - eval_time: 20m
    alertname: FuranoBackendHighLatency
    exp_alerts: []
- interval: 1m
  input_series:
  - series: process_start_time_seconds{job="go-auth",instance="authd:8080"}
    values: '0x30'
  alert_rule_test:
  - eval_time: 20m
    alertname: FuranoBackendRestarted
    exp_alerts: []
- interval: 1m
  input_series:
  - series: redis_up{job="redis",instance="redis"}
    values: '0x30'
  alert_rule_test:
  - eval_time: 0m
    alertname: RedisDown
    exp_alerts: []
  - eval_time: 20m
    alertname: RedisDown
    exp_alerts:
    - exp_labels:
        job: redis
        instance: redis
        severity: warning
      exp_annotations:
        summary: Redis is unavailable
        description: Inspect Redis service and exporter credentials.
- interval: 1m
  input_series:
  - series: redis_memory_used_bytes{job="redis",instance="redis"}
    values: 95x30
  - series: redis_memory_max_bytes{job="redis",instance="redis"}
    values: 100x30
  alert_rule_test:
  - eval_time: 0m
    alertname: RedisMemoryHigh
    exp_alerts: []
  - eval_time: 20m
    alertname: RedisMemoryHigh
    exp_alerts:
    - exp_labels:
        job: redis
        instance: redis
        severity: warning
      exp_annotations:
        summary: Redis memory exceeds 90% of maxmemory
        description: Inspect memory growth and eviction policy.
- interval: 1m
  input_series:
  - series: redis_evicted_keys_total{job="redis",instance="redis"}
    values: 0+1x30
  alert_rule_test:
  - eval_time: 0m
    alertname: RedisEvictions
    exp_alerts: []
  - eval_time: 20m
    alertname: RedisEvictions
    exp_alerts:
    - exp_labels:
        job: redis
        instance: redis
        severity: warning
      exp_annotations:
        summary: Redis is evicting keys
        description: Inspect cache sizing and eviction policy.
- interval: 1m
  input_series: []
  alert_rule_test:
  - eval_time: 0m
    alertname: CassandraJMXUnavailable
    exp_alerts: []
  - eval_time: 20m
    alertname: CassandraJMXUnavailable
    exp_alerts:
    - exp_labels:
        job: cassandra
        severity: warning
      exp_annotations:
        summary: Cassandra JMX metrics are unavailable
        description: CQL TCP probes are separate. Detailed JMX metrics require authenticated
          remote JMX setup; see monitoring/README.md.
- interval: 1m
  input_series:
  - series: nginx_up{job="nginx",instance="nginx"}
    values: '0x30'
  alert_rule_test:
  - eval_time: 0m
    alertname: NginxUnavailable
    exp_alerts: []
  - eval_time: 20m
    alertname: NginxUnavailable
    exp_alerts:
    - exp_labels:
        job: nginx
        instance: nginx
        severity: warning
      exp_annotations:
        summary: Nginx stub status is unavailable
        description: Check nginx and its private stub_status endpoint.
- interval: 1m
  input_series: []
  alert_rule_test:
  - eval_time: 0m
    alertname: MissingScrapeTargetsGoAuth
    exp_alerts: []
  - eval_time: 5m
    alertname: MissingScrapeTargetsGoAuth
    exp_alerts:
    - exp_labels:
        job: go-auth
        severity: critical
      exp_annotations:
        summary: No scrape targets discovered for go-auth
        description: Check Swarm replicas and tasks DNS discovery. A removed last
          task produces no up series and must not appear healthy.
- interval: 1m
  input_series:
  - series: up{job="go-auth",instance="task"}
    values: 1x10
  alert_rule_test:
  - eval_time: 5m
    alertname: MissingScrapeTargetsGoAuth
    exp_alerts: []
