include /etc/nginx/monitoring/nginx-metrics.conf;
server {
    listen 8080;
    server_name 176.108.251.108.nip.io;
    access_log syslog:server=nginxlog-exporter:8514,tag=nginx monitoring;
    location = /ping { return 200 "local\n"; }
    location = /metrics { return 404; }
    location / { proxy_pass http://fixture:8080; }
}
