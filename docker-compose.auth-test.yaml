services:
  auth-postgres:
    image: postgres:17
    environment: {POSTGRES_USER: auth, POSTGRES_PASSWORD: auth, POSTGRES_DB: auth}
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U auth"], interval: 1s, timeout: 3s, retries: 30}

  source-postgres:
    image: postgres:17
    environment: {POSTGRES_USER: source, POSTGRES_PASSWORD: source, POSTGRES_DB: source}
    volumes: ["./testdata/auth-source.sql:/docker-entrypoint-initdb.d/users.sql:ro"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U source"], interval: 1s, timeout: 3s, retries: 30}

  mailpit:
    image: axllent/mailpit:latest
    ports: ["18025:8025"]

  cassandra:
    image: cassandra:3.11.9
    environment:
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 100M
    volumes: ["./testdata/cassandra-auth-e2e.cql:/schema.cql:ro"]

  authd:
    build: {context: ../auth-master}
    environment:
      DATABASE_URL: postgres://auth:auth@auth-postgres:5432/auth?sslmode=disable
      HTTP_ADDR: :8080
      GRPC_ADDR: :9090
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      MAIL_FROM: auth@test.local
      REGISTRATION_INVITE_CALLBACK_URL: http://localhost:5173/register
      MAGIC_LINK_CALLBACK_URL: http://localhost:5173/admit
      ACCESS_TOKEN_TTL: 5s
      SIGNING_KEY_GRACE_PERIOD: 0s
    depends_on:
      auth-postgres: {condition: service_healthy}
      mailpit: {condition: service_started}

  auth-import:
    build: {context: ./backend/admin, dockerfile: Dockerfile.importer}
    environment:
      DATABASE_URL: postgres://auth:auth@auth-postgres:5432/auth?sslmode=disable
      FURANO_SOURCE_DATABASE_URL: postgres://source:source@source-postgres:5432/source?sslmode=disable
      FURANO_SUPERUSER: migrated
    depends_on:
      auth-postgres: {condition: service_healthy}
      source-postgres: {condition: service_healthy}

  backend:
    build: {context: ./backend/admin}
    ports: ["8081:80"]
    environment:
      ENV_TYPE: NODB
      AUTH_MASTER_URL: http://authd:8080
      CASSANDRA_HOST: cassandra
    depends_on:
      authd: {condition: service_started}
      cassandra: {condition: service_started}
