version: "3.8"

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17
    secrets:
      - postgres_user
      - postgres_password
      - postgres_db
    environment:
      POSTGRES_USER_FILE: /run/secrets/postgres_user
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB_FILE: /run/secrets/postgres_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - back
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$(cat /run/secrets/postgres_user) -d $$(cat /run/secrets/postgres_db)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.15"
          memory: 256M
      restart_policy:
        condition: on-failure

  # Dedicated private auth-master database. Its connection URL is supplied to
  # authd as a Docker secret; no database credential appears in service env or
  # command metadata.
  auth-postgres:
    image: "${AUTH_POSTGRES_IMAGE}"
    secrets:
      - auth_postgres_user
      - auth_postgres_password
      - auth_postgres_db
    environment:
      POSTGRES_USER_FILE: /run/secrets/auth_postgres_user
      POSTGRES_PASSWORD_FILE: /run/secrets/auth_postgres_password
      POSTGRES_DB_FILE: /run/secrets/auth_postgres_db
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    networks:
      - back
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$(cat /run/secrets/auth_postgres_user) -d $$(cat /run/secrets/auth_postgres_db)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.15"
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10
        window: 2m

  # Private identity service. Browser traffic reaches it only through go-auth's
  # fixed /auth BFF; there is intentionally no ports section.
  authd:
    image: "${AUTH_MASTER_IMAGE}"
    secrets:
      - auth_database_url
      - auth_password_history_key
      - auth_signing_key
      - auth_magic_callback_url
      - auth_invite_callback_url
      - auth_smtp_user
      - auth_smtp_password
    environment:
      DATABASE_URL_FILE: /run/secrets/auth_database_url
      PASSWORD_HISTORY_ENCRYPTION_KEY_FILE: /run/secrets/auth_password_history_key
      SIGNING_KEY_MASTER_KEY_FILE: /run/secrets/auth_signing_key
      MAGIC_LINK_CALLBACK_URL_FILE: /run/secrets/auth_magic_callback_url
      REGISTRATION_INVITE_CALLBACK_URL_FILE: /run/secrets/auth_invite_callback_url
      SMTP_USER_FILE: /run/secrets/auth_smtp_user
      SMTP_PASSWORD_FILE: /run/secrets/auth_smtp_password
      SMTP_HOST: "${AUTH_SMTP_HOST}"
      SMTP_PORT: "${AUTH_SMTP_PORT:-587}"
      MAIL_FROM: "${AUTH_MAIL_FROM}"
      REFRESH_COOKIE_SECURE: "true"
      HTTP_ADDR: :8080
      GRPC_ADDR: :9090
    networks:
      - back
      - metrics
    logging: *default-logging
    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.20"
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10
        window: 2m
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: stop-first

  redis:
    image: redis:latest
    hostname: redis
    secrets:
      - redis_password
    entrypoint: /bin/sh
    command: -c 'exec redis-server --requirepass "$$(cat /run/secrets/redis_password)"'
    volumes:
      - redis-data:/data
    networks:
      - back
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/redis_password)\" ping | grep -q PONG"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 128M
      restart_policy:
        condition: on-failure

  cassandra:
    image: cassandra:3.11.9
    hostname: cassandra
    environment:
      MAX_HEAP_SIZE: 1024M
      HEAP_NEWSIZE: 200M
    volumes:
      - cassandra3_data:/var/lib/cassandra
    networks:
      - back
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster'"]
      interval: 60s
      timeout: 30s
      retries: 10
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 2G
      restart_policy:
        condition: on-failure

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    secrets:
      - postgres_user
      - postgres_password
      - postgres_db
    entrypoint: /bin/sh
    command: >-
      -c 'export DATA_SOURCE_URI="postgres:5432/$$(cat /run/secrets/postgres_db)?sslmode=disable"
      && export DATA_SOURCE_USER="$$(cat /run/secrets/postgres_user)"
      && export DATA_SOURCE_PASS="$$(cat /run/secrets/postgres_password)"
      && exec /bin/postgres_exporter'
    networks:
      - back
      - metrics
    logging: *default-logging
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9187/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: 32M
      restart_policy:
        condition: on-failure

  auth-postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    secrets:
      - auth_postgres_user
      - auth_postgres_password
      - auth_postgres_db
    entrypoint: /bin/sh
    command: >-
      -c 'export DATA_SOURCE_URI="auth-postgres:5432/$$(cat /run/secrets/auth_postgres_db)?sslmode=disable"
      && export DATA_SOURCE_USER="$$(cat /run/secrets/auth_postgres_user)"
      && export DATA_SOURCE_PASS="$$(cat /run/secrets/auth_postgres_password)"
      && exec /bin/postgres_exporter'
    networks:
      - back
      - metrics
    logging: *default-logging
    depends_on:
      - auth-postgres
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9187/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: 32M
      restart_policy:
        condition: on-failure

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    secrets:
      - redis_password
    entrypoint: /bin/sh
    command: >-
      -c 'export REDIS_ADDR=redis:6379
      && export REDIS_PASSWORD="$$(cat /run/secrets/redis_password)"
      && exec /redis_exporter'
    networks:
      - back
      - metrics
    logging: *default-logging
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9121/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: 32M
      restart_policy:
        condition: on-failure

  cassandra-exporter:
    image: criteord/cassandra_exporter:2.3.8
    environment:
      JVM_OPTS: "-Xms32m -Xmx128m"
    volumes:
      - ./monitoring/cassandra-exporter.yml:/etc/cassandra_exporter/config.yml:ro
    networks:
      - back
      - metrics
    logging: *default-logging
    depends_on:
      - cassandra
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8080"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: 256M
      restart_policy:
        condition: on-failure

  node-exporter:
    image: prom/node-exporter:v1.7.0
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    networks:
      - metrics
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9100/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      mode: global
      resources:
        limits:
          cpus: "0.05"
          memory: 32M
      restart_policy:
        condition: on-failure

  go-auth:
    image: "${FURANO_BACKEND_IMAGE}"
    secrets:
      - go_auth_env
    entrypoint: /bin/sh
    command: -c 'set -a && . /run/secrets/go_auth_env && set +a && exec ./main_app'
    environment:
      AUTH_MASTER_URL: http://authd:8080
      SMTP_TIMEOUT: "${FURAN_SMTP_TIMEOUT:-5s}"
    networks:
      - back
      - metrics
    depends_on:
      - authd
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/ping"]
      interval: 90s
      timeout: 30s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.15"
          memory: 128M
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./monitoring/nginx-metrics.conf:/etc/nginx/monitoring/nginx-metrics.conf:ro
      - ./deploy/swarm/configs/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - metrics
      - ingress
    depends_on:
      - go-auth
      - grafana
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/nginx-health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 64M
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.1.0
    command:
      - -nginx.scrape-uri=http://nginx:8080/stub_status
    networks:
      - metrics
    logging: *default-logging
    depends_on:
      - nginx
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: 32M
      restart_policy:
        condition: on-failure

  prometheus:
    image: prom/prometheus
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d", "--storage.tsdb.retention.size=2GB"]
    volumes:
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    networks:
      - metrics
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 512M
      restart_policy:
        condition: on-failure

  grafana:
    image: grafana/grafana
    volumes:
      - ./monitoring/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./monitoring/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./monitoring/dashboards/:/etc/grafana/provisioning/dashboards/:ro
      - grafanadata:/var/lib/grafana
    networks:
      - metrics
    depends_on:
      - prometheus
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 128M
      restart_policy:
        condition: on-failure

  loki:
    image: grafana/loki:2.9.0
    volumes:
      - ./monitoring/loki-config.yaml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - metrics
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 128M
      restart_policy:
        condition: on-failure

  promtail:
    image: grafana/promtail:2.9.0
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log:/var/log:ro
      - ./monitoring/promtail-config.yaml:/etc/promtail/config.yaml:ro
    command: -config.file=/etc/promtail/config.yaml
    privileged: true
    networks:
      - metrics
    logging: *default-logging
    depends_on:
      - loki
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9080/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      mode: global
      resources:
        limits:
          cpus: "0.05"
          memory: 64M
      restart_policy:
        condition: on-failure

  nginxlog-exporter:
    image: quay.io/martinhelmich/prometheus-nginxlog-exporter:v1.11.0
    command:
    - -config-file
    - /etc/nginxlog.yml
    volumes:
    - ./monitoring/nginxlog.yml:/etc/nginxlog.yml:ro
    networks:
    - metrics
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.10'
      restart_policy:
        condition: on-failure
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.26.0
    command:
    - --config.file=/etc/blackbox.yml
    volumes:
    - ./monitoring/blackbox.yml:/etc/blackbox.yml:ro
    networks:
    - metrics
    - back
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.10'
      restart_policy:
        condition: on-failure
  alertmanager:
    image: prom/alertmanager:v0.28.1
    command:
    - --config.file=/etc/alertmanager/alertmanager.yml
    - --storage.path=/alertmanager
    volumes:
    - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    - alertmanagerdata:/alertmanager
    networks:
    - metrics
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.10'
      restart_policy:
        condition: on-failure

secrets:
  go_auth_env:
    external: true
  postgres_user:
    external: true
  postgres_password:
    external: true
  postgres_db:
    external: true
  redis_password:
    external: true
  auth_postgres_user:
    external: true
  auth_postgres_password:
    external: true
  auth_postgres_db:
    external: true
  auth_database_url:
    external: true
  auth_password_history_key:
    external: true
  auth_signing_key:
    external: true
  auth_magic_callback_url:
    external: true
  auth_invite_callback_url:
    external: true
  auth_smtp_user:
    external: true
  auth_smtp_password:
    external: true

volumes:
  alertmanagerdata:
  postgres_data:
  auth_postgres_data:
  redis-data:
  cassandra3_data:
    external: true
    name: "${SWARM_CASSANDRA_VOLUME:-furanocoumarins_swarm_cassandra3_data}"
  grafanadata:
  prometheusdata:

networks:
  back:
    driver: overlay
  metrics:
    driver: overlay
  ingress:
    driver: overlay
