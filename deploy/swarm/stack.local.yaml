version: "3.8"

# Optional overlay for local/dev Swarm: adds MinIO for S3-compatible storage.
# Deploy: ./deploy/swarm/scripts/deploy.sh --local

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  minio:
    image: minio/minio:latest
    hostname: minio
    command: server /data
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    networks:
      - back
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 128M
      restart_policy:
        condition: on-failure

  go-auth:
    depends_on:
      minio:
        condition: service_healthy

  # Swarm does not retain Compose one-shot dependencies. Reconcile the local
  # policy continuously so existing MinIO volumes receive policy updates.
  minio-policy:
    image: minio/minio:latest
    entrypoint: ["/bin/sh", "/init/reconcile-local-policy.sh"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ../../deploy/minio/admin-images-public-read.json:/policy/public-read.json:ro
      - ../../deploy/minio/reconcile-local-policy.sh:/init/reconcile-local-policy.sh:ro
    networks:
      - back
    logging: *default-logging
    deploy:
      replicas: 1
      restart_policy:
        condition: any

volumes:
  minio_data:
