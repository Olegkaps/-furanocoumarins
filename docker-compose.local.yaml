x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # nginx:
  #   image: nginx:latest
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ./nginx/conf.d:/etc/nginx/conf.d
  #   depends_on:
  #     - go-auth
  #     - go-search
  #     # - python-app

  go-auth:
    restart: always
    healthcheck:
      test: ["CMD", "curl", "localhost/ping"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    build:
      context: ./backend/admin
    ports:
      - "8081:80"
    env_file:
      "env/.env"
    environment:
      AUTH_MASTER_URL: http://authd:8080
      ALLOW_ORIGIN: http://localhost:5173
      SMTP_TIMEOUT: "5s"
    depends_on:
      minio:
        condition: service_started
      authd:
        condition: service_healthy
    networks:
      - back
      - metrics
    logging: *default-logging

  auth-postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth-local-only
      POSTGRES_DB: auth
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    networks:
      - back
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d auth"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
    networks:
      - back
    logging: *default-logging

  authd:
    build:
      context: ${AUTH_MASTER_CONTEXT:-../auth-master}
    environment:
      DATABASE_URL: postgres://auth:auth-local-only@auth-postgres:5432/auth?sslmode=disable
      HTTP_ADDR: :8080
      GRPC_ADDR: :9090
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_TIMEOUT: "5s"
      MAIL_FROM: auth@localhost
      REGISTRATION_INVITE_CALLBACK_URL: http://localhost:5173/register
      MAGIC_LINK_CALLBACK_URL: http://localhost:5173/admit
    depends_on:
      auth-postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - back
    logging: *default-logging
    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 30

  auth-import:
    profiles: ["migration"]
    build:
      context: ./backend/admin
      dockerfile: Dockerfile.importer
    environment:
      DATABASE_URL: postgres://auth:auth-local-only@auth-postgres:5432/auth?sslmode=disable
      FURANO_SOURCE_DATABASE_URL: ${FURANO_SOURCE_DATABASE_URL:-}
      FURANO_SUPERUSER: ${FURANO_SUPERUSER:-}
    depends_on:
      auth-postgres:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - back

  redis:
    hostname: redis
    image: redis:latest
    env_file:
      "env/redis.env"
    expose:
      - "53"
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - appnet
      - back
    logging: *default-logging

  postgres:
    restart: always
    image: postgres:17
    expose:
      - "53"
    ports:
      - "5432:5432"
    env_file:
      "env/postgres.env"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ps
      - back
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

#  adminer:
#    image: adminer
#    restart: always
#    ports:
#      - 8080:8080
#    depends_on:
#      - postgres
#    networks:
#      - ps

  minio:
    hostname: minio
    image: minio/minio:latest
    command: server /data
    expose:
      - "9000"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    networks:
      - back
    logging: *default-logging

  cassandra:
    hostname: cassandra
    image: cassandra:3.11.9
    expose:
      - "53"
    ports:
      - "9042:9042"
    volumes:
      - cassandra3_data:/var/lib/cassandra
    networks:
      - appnet
      - back
    logging: *default-logging

